<footer class="taskbar">
  <button type="button" class="taskbar__home" (click)="launcher.goHome()">🌙 NourOS</button>

  <nav class="taskbar__windows" aria-label="Open windows">
    @for (app of openApps(); track app.id) {
      <button
        type="button"
        class="taskbar__window"
        [class.taskbar__window--focused]="windowManager.isFocused(app.id)"
        [attr.aria-pressed]="windowManager.isFocused(app.id)"
        (click)="launcher.toggleFromTaskbar(app.id)"
      >
        <img [src]="app.icon" alt="" width="18" height="18" />
        {{ app.title }}
      </button>
    }
  </nav>

  <ul class="taskbar__statuses" aria-label="Status">
    @for (status of statuses; track status.label) {
      <li class="taskbar__status">
        <span class="taskbar__status-label">{{ status.label }}:</span> {{ status.value }}
      </li>
    }
  </ul>

  @for (app of taskbarApps; track app.id) {
    <button type="button" class="taskbar__cv" (click)="launcher.launch(app)">
      <img [src]="app.icon" alt="" width="18" height="18" />
      {{ app.title }}
    </button>
  }

  <time class="taskbar__clock" [attr.datetime]="now().toISOString()">
    {{ now() | date: 'HH:mm' }}
  </time>
</footer>
